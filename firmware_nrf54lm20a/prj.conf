# XIAO nRF54LM20A 游戏鼠标固件
#   阶段 1：bring-up + PAW3395 传感器驱动
#   阶段 2：BLE HID 鼠标 + LLPM（低延迟 1ms 连接间隔）

# 基础外设
CONFIG_GPIO=y
CONFIG_POWEROFF=y
CONFIG_SPI=y
CONFIG_I2C=y
CONFIG_SERIAL=y
CONFIG_PRINTK=y
CONFIG_ASSERT=y

# 电量读取：nPM1300 charger 走 sensor API（VBAT -> 百分比）
# charger/mfd/gpio-i2c 驱动由板级 DT 自动拉起，这里只开 sensor 子系统
CONFIG_SENSOR=y

# 日志：用默认的 deferred 模式（有独立日志线程），避免日志输出阻塞无线电时序
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# ---------------- BLE HID 鼠标 ----------------
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="XIAO Mouse"
CONFIG_BT_DEVICE_APPEARANCE=962
CONFIG_BT_MAX_CONN=1
# 配对槽：dongle 和 Windows（开发期直连调试用）都要能存，
# 只留 1 个会在"Windows 配过对"之后把 dongle 的 bond 顶掉，
# 重连时 dongle 走新配对会被鼠标回 Pairing Not Allowed（实测 err=4）。
CONFIG_BT_MAX_PAIRED=4
CONFIG_BT_ATT_TX_COUNT=12
CONFIG_BT_CONN_CTX=y

# 1 kHz 通知的发送缓冲。
# 实测（gdb 读内核对象）：主线程会卡在 bt_gatt_notify -> net_buf_alloc(att_pool,
# K_FOREVER)，也就是 ATT/ACL 发送池被占满时**无限期阻塞**（Zephyr 只对系统
# 工作队列线程用 K_NO_WAIT）。默认 ACL TX 只有 3 个，1 kHz 位移流 + dongle
# 重启/断链回不来时很容易打满，主循环就永久停住（灯不灭、不广播、按键无效）。
CONFIG_BT_BUF_ACL_TX_COUNT=12
CONFIG_BT_CONN_TX_MAX=12
CONFIG_BT_L2CAP_TX_BUF_COUNT=12
# 协议栈要求 EVT_RX 缓冲数必须大于 ACL TX 缓冲数（buf.h 里的 BUILD_ASSERT）
CONFIG_BT_BUF_EVT_RX_COUNT=16
# 主循环卡死时的自愈复位（sys_reboot）
CONFIG_REBOOT=y

# 标准 Battery Service：电量经 BAS(0x180F/0x2A19) 报给 dongle，
# 由 dongle 的红灯做低电提示（鼠标上的灯省电只做充电呼吸）。
CONFIG_BT_BAS=y

# 呼吸灯需要调亮度：用板级 pwm-leds（PWM20 三路 -> RGB 三个脚）
CONFIG_PWM=y

# HID over GATT（服务实现在 nrf/subsys/bluetooth/services/hids.c）
CONFIG_BT_HIDS=y
CONFIG_BT_HIDS_INPUT_REP_MAX=2
CONFIG_BT_HIDS_OUTPUT_REP_MAX=0
CONFIG_BT_HIDS_FEATURE_REP_MAX=0
CONFIG_BT_HIDS_ATTR_MAX=24
CONFIG_BT_HIDS_MAX_CLIENT_COUNT=1
# HID 属性要求加密：Windows 作为 HOG 主机会走配对/加密流程，
# 不加密会表现为"能连上但立刻掉"
CONFIG_BT_HIDS_DEFAULT_PERM_RW_ENCRYPT=y
CONFIG_BT_GATT_UUID16_POOL_SIZE=40
CONFIG_BT_GATT_CHRC_POOL_SIZE=20

# 设备信息服务（主机常会查）
CONFIG_BT_DIS=y
CONFIG_BT_DIS_MANUF_NAME=y
CONFIG_BT_DIS_MANUF_NAME_STR="Seeed"
CONFIG_BT_DIS_PNP=y
CONFIG_BT_DIS_PNP_VID_SRC=2
CONFIG_BT_DIS_PNP_VID=0x1915
CONFIG_BT_DIS_PNP_PID=0x5258
CONFIG_BT_DIS_PNP_VER=0x0100

# ---------------- 配对 / 绑定 ----------------
# 主机侧（尤其 Windows HOG）会主动发起配对，没开 SMP 会直接失败
CONFIG_BT_SMP=y
# 不做 MITM：无 IO 能力 -> Just Works；也不需要应用层 auth 回调
CONFIG_BT_SMP_APP_PAIRING_ACCEPT=n
# 绑定槽位只有 1 个：换主机（Windows -> dongle）时，旧绑定占满会让
# bt_keys_get_addr() 返回 NULL，SMP 直接回 Pairing Failed(0x08 Unspecified)。
# 打开"顶掉最旧绑定"，新主机才能配对成功。
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y

# 绑定信息落盘（LTK/IRK），否则每次断电都要重新配对
# 注意：存储用的是板级 storage_partition
CONFIG_SETTINGS=y
CONFIG_BT_SETTINGS=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y

# ---------------- LLPM ----------------
# 让 SDC 支持 Nordic 私有的低延迟模式（连接间隔可降到 1ms）。
# 注意：只有对端也是 Nordic SDC（如 Nordic dongle）并主动发起时才会真正用上 1ms；
# 连普通 PC 蓝牙时只会拿到常规间隔，属正常现象。
CONFIG_BT_CTLR_SDC_LLPM=y
# LLPM 1 ms 要求连接事件长度不超过间隔；默认 7500 us 会让控制器拒绝 1 ms。
CONFIG_BT_CTLR_SDC_MAX_CONN_EVENT_LEN_DEFAULT_OVERRIDE=y
CONFIG_BT_CTLR_SDC_MAX_CONN_EVENT_LEN_DEFAULT=1000
# 关掉 GAP「peripheral preferred connection parameters」，否则主机读到默认的
# 30~50ms 偏好参数，不会去协商 LLPM 间隔
CONFIG_BT_GAP_PERIPHERAL_PREF_PARAMS=n

# 避免部分笔记本蓝牙控制器同时发起多个 Link Layer 过程导致断连
CONFIG_BT_GATT_AUTO_SEC_REQ=n
CONFIG_BT_AUTO_PHY_UPDATE=n

# ---------------- 栈 ----------------
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_BT_TX_PROCESSOR_STACK_SIZE=1024
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
