# 鼠标固件 —— ESB 2.4G 变体（配合 ProMicro nRF52840 dongle 的 ESB PRX）
#
# 构建（在 junction C:/Users/asus/.cache/xiao-fw 下）：
#   cmake -B build-esb -GNinja -DBOARD=xiao_nrf54lm20a/nrf54lm20a/cpuapp \
#         -DCONF_FILE=prj_esb.conf
#   cmake --build build-esb
#
# 注意：ESB 与 BLE 争用同一颗射频，此变体不含蓝牙；烧录后 BLE 版不可用，
# 想换回去用默认 prj.conf 重新构建 build 目录即可。

# 基础外设
CONFIG_GPIO=y
CONFIG_POWEROFF=y
CONFIG_SPI=y
CONFIG_I2C=y
CONFIG_SERIAL=y
CONFIG_PRINTK=y
CONFIG_ASSERT=y

# 电量读取：nPM1300 charger 走 sensor API
CONFIG_SENSOR=y

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# ---------------- 规避 Kconfig 警告中止 ----------------
# ESB 变体不需要加密栈。注意 NRF_SECURITY / PSA_CRYPTO 是无 prompt 的
# select 符号，不能在 conf 里直接赋值，只能关掉把它们拉起来的入口。
CONFIG_FLASH_AREA_CHECK_INTEGRITY=n
CONFIG_SECURE_STORAGE=n
# 板级 defconfig 打开的弃用符号会触发弃用警告，同样导致中止
CONFIG_NRF_PLATFORM_LUMOS=n

# ---------------- 2.4G ESB PTX ----------------
# 选择 ESB 变体（CMake 据此编译 esb_ptx.c 而非 ble_hid.c）
CONFIG_APP_ESB=y
CONFIG_ESB=y
# nRF54L 系列：ESB 库需要初始化 HF 时钟
CONFIG_ESB_CLOCK_INIT=y
# 注意：本 SoC 上 CLOCK_CONTROL_NRF2 不可用（Kconfig 依赖不满足），只能用
# 旧驱动 CLOCK_CONTROL_NRF，ESB 的时钟分支走 z_nrf_clock_control_get_onoff(HF)。
# 正式固件只保留告警：ESB 库的 DBG 日志在 1 kHz 收发路径上会明显拖慢时序，
# 排查链路问题时再临时改回 CONFIG_ESB_LOG_LEVEL_DBG。
CONFIG_ESB_LOG_LEVEL_WRN=y
# 注意：radio SHORTS 的 DISABLED_RXEN 位在 LM20A 上写入无效（TX 完成后无法
# 自动切 RX 收 ACK）。TX→ACK-RX 切换由 esb_ptx.c 手动建的 DPPI 链完成；
# Kconfig 的 ESB_FAST_SWITCHING 依赖只放行 54H20_CPURAD，这里开不了。

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# 主循环卡死时的自愈复位（main.c 的 stall_guard 用 sys_reboot）
CONFIG_REBOOT=y
# 充电呼吸灯走板级 pwm-leds
CONFIG_PWM=y
