# ---- USB（新设备栈）：HID 鼠标 + CDC 控制台 复合设备 ----
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_HID_SUPPORT=y
CONFIG_USBD_CDC_ACM_CLASS=y
# 注意：必须保持 n（与 hid-mouse sample 一致）。
# 开了 at-boot 会让 CDC 类实例先于 usbd_register_all_classes 初始化，
# 实测导致类注册失败/枚举反复总线复位。
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n

# 定位类注册失败：开 USB 核心调试日志（已确认正常，降回 WRN 降噪）
CONFIG_USBD_LOG_LEVEL_WRN=y
CONFIG_USBD_HID_LOG_LEVEL_WRN=y

# ---- BLE 主机（替代 ESB 2.4G）----
# dongle 主动连接鼠标并订阅 HID 通知，再转成本机 USB HID。
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_SMP=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_DEVICE_NAME="XIAO Dongle"
# 鼠标侧 HID 上报要求加密，这里关掉自动安全请求，由初始化流程主动升级
CONFIG_BT_GATT_AUTO_SEC_REQ=n
CONFIG_BT_AUTO_PHY_UPDATE=n
# 预留 Nordic 私有 LLPM（1 ms）能力
CONFIG_BT_CTLR_SDC_LLPM=y
# LLPM 1 ms 要求连接事件长度不超过间隔；默认 7500 us 会让控制器拒绝 1 ms。
CONFIG_BT_CTLR_SDC_MAX_CONN_EVENT_LEN_DEFAULT_OVERRIDE=y
CONFIG_BT_CTLR_SDC_MAX_CONN_EVENT_LEN_DEFAULT=1000

# ---- 配对持久化：dongle 必须记住 LTK ----
# 否则每次重新上电都丢掉密钥，会重新发起配对；而鼠标侧还留着旧绑定，
# Zephyr 的 update_keys_check() 会以 AUTH_REQUIREMENTS(0x04) 拒绝重配。
# 板级 DTS 已经在 0xEC000 定义了 32 KB 的 storage_partition，直接用。
CONFIG_SETTINGS=y
CONFIG_BT_SETTINGS=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# ---- 控制台：printk / log 走 USB CDC 虚拟串口 ----
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y

# ---- 其它 ----
CONFIG_GPIO=y
CONFIG_HWINFO=y

# ---- USB 描述符 ----
# VID 用 Nordic 的 0x1915（开发阶段惯例），PID 自选；量产前需换正式 VID/PID
CONFIG_SAMPLE_USBD_PID=0x4242
