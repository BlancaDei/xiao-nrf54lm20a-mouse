# ---- XIAO 2.4G dongle：ESB PRX 变体（配合鼠标端 prj_esb.conf） ----
#
# 与 BLE 版共用 main.c / USB HID 布局，只把接收层换成 ESB：
#   鼠标 PTX --2.4G--> 本机 PRX --> USB HID --> 电脑
# 该变体不含蓝牙，烧录后 BLE 版要重新构建 build 目录才能回去。

# ---- USB（新设备栈）：HID 鼠标 + CDC 控制台 复合设备 ----
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_HID_SUPPORT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n

CONFIG_USBD_LOG_LEVEL_WRN=y
CONFIG_USBD_HID_LOG_LEVEL_WRN=y

# ---- 2.4G ESB PRX ----
# 选择 ESB 变体（CMake 据此编译 esb_rx.c 而非 ble_ctr.c）
CONFIG_APP_ESB=y
CONFIG_ESB=y
# ESB 库自己拉起 HF 时钟（nRF52840 走 CLOCK_CONTROL_NRF 分支）
CONFIG_ESB_CLOCK_INIT=y
# 负载 10 字节，默认 32 足够；RX FIFO 加深一点，1 kHz 下留缓冲
CONFIG_ESB_RX_FIFO_SIZE=16

# ---- 配置持久化（厂商 HID 通道的设置存 NVS）----
# 板级 DTS（uf2 变体）在 0xEC000 定义了 32 KB storage_partition
CONFIG_SETTINGS=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# ---- 控制台：printk / log 走 USB CDC 虚拟串口 ----
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y

# ---- 其它 ----
CONFIG_GPIO=y
# 低电呼吸灯：走板载 pwm0（P0.15），用 pwm-leds 硬件调光
CONFIG_PWM=y
CONFIG_LED=y
CONFIG_LED_PWM=y
CONFIG_HWINFO=y

# ---- USB 描述符 ----
CONFIG_SAMPLE_USBD_PID=0x4242
